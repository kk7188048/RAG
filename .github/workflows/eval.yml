name: Eval gate

on:
  pull_request:
    branches: [main]

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 45  # judge scoring can retry once on total failure (see run_eval.py)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run eval (small sample -- CI smoke check, not the full baseline)
        env:
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          PINECONE_INDEX_NAME: healthcare-rag
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: python eval/run_eval.py --strategy vector --max-samples 8 --fail-threshold
